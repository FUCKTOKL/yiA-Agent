<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yiA · 空间玻璃原型</title>
<link rel="stylesheet" href="css/tokens.css?v=4">
<link rel="stylesheet" href="css/base.css?v=4">
<link rel="stylesheet" href="css/chat.css?v=4">
<link rel="stylesheet" href="css/memory.css?v=4">
<link rel="stylesheet" href="css/reminders.css?v=4">
<link rel="stylesheet" href="css/wechat.css?v=4">
</head>
<body>

<div class="env"></div>

<script>
/* file:// 下 ES 模块被 CORS 拦截：给出可行动提示而非白屏 */
if(location.protocol==='file:')addEventListener('DOMContentLoaded',()=>{
  document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;font:14px/1.9 sans-serif;color:#ddd;text-align:center">本原型为 ES 模块，需经本地服务器打开：<br><code style="font-family:monospace">cd yia-ui && python3 -m http.server 8123</code><br>然后访问 <code style="font-family:monospace">http://localhost:8123</code></div>';
});
</script>

<!-- 标签轨 -->
<nav class="rail glass">
  <div class="brand">yiA</div>
  <button class="nav-btn active" data-page="chat" title="对话" aria-label="对话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
  </button>
  <button class="nav-btn" data-page="memory" title="记忆图谱" aria-label="记忆图谱">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="17" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M8 15.5 15 8M9.5 17H14"/></svg>
  </button>
  <button class="nav-btn" data-page="reminders" title="提醒" aria-label="提醒">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
  </button>
  <button class="nav-btn" data-page="wechat" title="微信" aria-label="微信">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 10.5c0 3.6-3.6 6.5-8 6.5-.9 0-1.8-.1-2.6-.4L5 18l.9-3A6.2 6.2 0 0 1 4 10.5C4 6.9 7.6 4 12 4s8 2.9 8 6.5z"/><circle cx="9.5" cy="10.5" r=".8" fill="currentColor"/><circle cx="14.5" cy="10.5" r=".8" fill="currentColor"/></svg>
  </button>
  <div class="rail-spacer"></div>
  <button class="tool-btn" id="bgBtn" title="更换背景图片" aria-label="更换背景图片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L7 20"/></svg>
  </button>
  <button class="tool-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题">
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="status-btn" id="statusBtn" title="系统状态" aria-label="系统状态"><span class="dot"></span></button>
  <div class="status-pop glass-sub" id="statusPop">
    <div><span class="sdot ok"></span>调度守护 <b class="ok">在线</b></div>
    <div><span class="sdot ok"></span>网关 <b class="ok">在线</b></div>
    <div>记忆 <b id="stMem">7</b> 条</div>
    <div>待发提醒 <b id="stRem">3</b> 条</div>
  </div>
</nav>

<input type="file" id="bgInput" accept="image/*" hidden>

<main class="stage" id="stage"></main>

<script type="module" src="js/app.js?v=4"></script>
</body>
</html>
